name: Refresh niche headlines
on:
  push:
    branches: [main]
    paths: ['scripts/refresh-news.py', '.github/workflows/refresh-news.yml']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: refresh-niche-headlines
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Open the edition branch
        run: |
          edition="$RUNNER_TEMP/news-edition"
          git ls-remote --heads origin refs/heads/news-feed > "$RUNNER_TEMP/news-ref"
          if test -s "$RUNNER_TEMP/news-ref"; then
            git fetch --depth=1 origin refs/heads/news-feed
            git worktree add --detach "$edition" FETCH_HEAD
          else
            git worktree add --detach "$edition" HEAD
            git -C "$edition" switch --orphan first-edition
          fi
      - name: Fetch feeds and retain the last successful headlines
        run: python3 scripts/refresh-news.py "$RUNNER_TEMP/news-edition/headlines.json"
      - name: Publish changed headlines
        run: |
          cd "$RUNNER_TEMP/news-edition"
          git add -- headlines.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh publisher headlines'
          git push origin HEAD:refs/heads/news-feed
